name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: 后端单测（mvn test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 单测全部是 H2 内存库 + mock，不需要外部数据库
      - name: mvn -B test
        run: mvn -B test

  frontend:
    name: 前端构建（npm ci + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      - name: 上传 dist 供 E2E 复用
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  e2e:
    name: 端到端（Playwright）
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: 下载前端产物到静态目录
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/src/main/resources/static

      # 前端已进 classpath:/static，打出的 jar 同源提供页面与 API
      - name: 打包后端
        working-directory: server
        run: mvn -B -DskipTests package

      - name: 安装 Playwright 浏览器
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 启动服务并等待 /health
        working-directory: server
        run: |
          java -jar target/hazmat-management-1.0.0.jar --server.port=8080 \
            --spring.datasource.url='jdbc:h2:file:./data/ci-hazmat;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE' \
            > /tmp/hazmat.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "就绪（${i}s）"
              curl -fsS http://localhost:8080/health
              exit 0
            fi
            sleep 1
          done
          echo "服务未就绪，日志尾部："
          tail -n 80 /tmp/hazmat.log
          exit 1

      - name: 运行 E2E
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: 失败时上传日志与报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            /tmp/hazmat.log
            e2e/report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
