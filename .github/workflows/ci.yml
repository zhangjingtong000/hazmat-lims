name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: mvn test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 单测全部是 H2 内存库 + mock，不需要外部数据库
      - name: mvn -B test
        run: mvn -B test
